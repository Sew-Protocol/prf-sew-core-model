name: Sew Core model package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.1.1435
      - name: Resolve pinned dependencies
        run: clojure -Srepro -P
      - name: Run package contract tests
        run: clojure -Srepro -M:test
